# Project-level Gradle settings.

# Enable AndroidX support
android.useAndroidX=true

# Enable non-transitive R class for faster builds
android.nonTransitiveRClass=true

# Configure Gradle JVM memory
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable parallel execution and build caching
org.gradle.parallel=true
org.gradle.caching=true

# Disable kapt incremental processing to prevent Kotlin 2.0 processingEnv NPE
kapt.incremental.apt=false

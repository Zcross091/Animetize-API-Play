name: Build and Deploy RoninX Anime Apps

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # =============================================================
  # Job 1: Build Android Application (APK)
  # =============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoninX-Anime-Client-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  # =============================================================
  # Job 2: Build Web Application (Vite / React)
  # =============================================================
  build-web:
    name: Build Web Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Locate Web Application Directory
        id: web-dir
        run: |
          if [ -f "package.json" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "web-backup/package.json" ]; then
            echo "dir=web-backup" >> $GITHUB_OUTPUT
          elif [ -f "Anime Miner Frontend WEB/package.json" ]; then
            echo "dir=Anime Miner Frontend WEB" >> $GITHUB_OUTPUT
          else
            echo "Could not find package.json"
            exit 1
          fi

      - name: Install Dependencies
        run: |
          cd "${{ steps.web-dir.outputs.dir }}"
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web Application
        run: |
          cd "${{ steps.web-dir.outputs.dir }}"
          npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoninX-Anime-Client-Web-Build
          path: ${{ steps.web-dir.outputs.dir }}/dist/

      - name: Package Artifact for GitHub Pages
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.web-dir.outputs.dir }}/dist/

  # =============================================================
  # Job 3: Deploy Web Client to GitHub Pages
  # =============================================================
  deploy-pages:
    name: Deploy Web Client to GitHub Pages
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    needs: build-web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =============================================================
  # Job 4: Create GitHub Release on Tag (e.g. v1.0.0)
  # =============================================================
  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: RoninX-Anime-Client-Android-APK
          path: ./release-assets/

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: RoninX-Anime-Client-Web-Build
          path: ./web-dist/

      - name: Archive Web Build
        run: |
          cd ./web-dist && zip -r ../release-assets/RoninX-Anime-Client-Web.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release-assets/app-debug.apk
            ./release-assets/RoninX-Anime-Client-Web.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

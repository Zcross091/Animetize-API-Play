name: Daily Anime Stream Miner

on:
  schedule:
    - cron: '30 4 * * *'  # 10:00 AM IST
    - cron: '0 13 * * *'  # 6:30 PM IST
    - cron: '10 17 * * *' # 10:40 PM IST
  workflow_dispatch:
    inputs:
      query:
        description: 'Optional: Anime title to mine (leave blank for Auto-Crawler Mode)'
        required: false
        default: ''
      episode:
        description: 'Optional: Episode number'
        required: false
        default: ''
      source:
        description: 'Optional: Source override (e.g. allanime, gogoanime)'
        required: false
        default: ''

jobs:
  trigger-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Auto-Crawler / Miner to Ronin API
        run: |
          echo "🚀 Dispatching auto-crawler event to Ronin-API..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_PAT || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/Zcross091/Ronin-API/dispatches \
            -d "{\"event_type\": \"search-or-mine\", \"client_payload\": {\"query\": \"${{ github.event.inputs.query || '' }}\", \"episode\": \"${{ github.event.inputs.episode || '' }}\", \"source\": \"${{ github.event.inputs.source || '' }}\"}}"
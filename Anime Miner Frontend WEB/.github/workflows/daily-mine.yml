name: Daily Anime Stream Miner

on:
  schedule:
    # Runs daily at 17:10 UTC (10:40 PM IST)
    - cron: '10 17 * * *'
  workflow_dispatch: # Allows manual triggering anytime via Actions tab

jobs:
  trigger-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Auto-Crawler to Ronin API
        run: |
          echo "🚀 Dispatching daily auto-crawler event to Ronin-API..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_PAT || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/Zcross091/Ronin-API/dispatches \
            -d '{"event_type": "search-or-mine", "client_payload": {"query": "", "episode": "", "source": ""}}'